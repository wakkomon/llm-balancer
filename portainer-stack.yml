# Portainer → Stacks → Add stack → Web editor: diesen Inhalt einfügen.
services:
  llm-balancer:
    image: ghcr.io/wakkomon/llm-balancer:latest
    container_name: llm-balancer
    restart: unless-stopped
    stop_grace_period: 40s   # laufende Generierungen beim Stoppen/Update bis zu 30 s zu Ende laufen lassen
    ports:
      - "8080:8080"          # API für LiteLLM + Web-UI unter http://<host>:8080/balancer/
    environment:
      # Startkonfiguration: name=url[*parallele_slots][@priorität], kommagetrennt.
      # Wird nur verwendet, solange die Server-Liste nicht in der Web-UI geändert wurde.
      # Danach gilt die gespeicherte Liste im Volume (/data/backends.json);
      # Zurück zu diesem Wert: POST /balancer/api/reset (oder /data/backends.json löschen).
      BACKENDS: "gpu=http://192.168.1.50:8080@0,amd=http://192.168.1.60:8080@1"
      # Optional: Bearer-Tokens der LLM-Server (name=token, Namen wie in BACKENDS).
      # Auch später in der Web-UI pro Server einstellbar.
      # BACKEND_KEYS: "gpu=sk-server-token"
      # Optional: Token(s), die Clients wie LiteLLM für den Zugriff auf den Balancer brauchen
      # (name=token, kommagetrennt). Weitere Tokens lassen sich in der Web-UI erzeugen.
      # Ohne Token (hier und in der UI) ist die LLM-API offen.
      # API_KEYS: "litellm=ein-langes-zufaelliges-token"
      # Optional: Token, ohne den keine Änderungen in der UI möglich sind
      # ADMIN_TOKEN: "ein-langes-geheimes-passwort"
      # DNS-Server für die Namen der LLM-Server (IPs, kommagetrennt). Wird zuerst gefragt,
      # danach der Docker-DNS – Namen anderer Container funktionieren weiter.
      # DNS_SERVERS: "192.168.1.1"
      TZ: "Europe/Berlin"        # Zeitzone für Tagesgrenzen der Statistik
      CURRENCY: "€"              # Währung für die Preise pro API-Token
      # UNKNOWN_MODEL: "reject"  # Modelle, die keine Gruppe/kein Server kennt: 404 statt an alle Server
      # STREAM_USAGE: "false"    # Stream-Anfragen nicht um stream_options.include_usage ergänzen
      # RETRY_STATUS: "all"     # Standard: jeden Fehler intern auf anderen Servern/Fallback wiederholen; Liste z. B. "404,429"
      # TAG_CHECK: "think,tool_call"  # Tags, die im generierten Text geprüft werden ("*" = alle, "off" = aus)
      STATS_DAYS: "400"          # wie viele Tage Statistik aufbewahrt werden
      QUEUE_TIMEOUT_SEC: "900"   # max. Wartezeit in der Queue (0 = unbegrenzt)
      MAX_QUEUE: "0"             # max. Anzahl wartender Anfragen (0 = unbegrenzt)
      HEALTH_PATH: "/v1/models"  # für llama.cpp alternativ "/health"
      HEALTH_INTERVAL_SEC: "15"
    # Alternative zu DNS_SERVERS (gilt für den ganzen Container) bzw. Namen fest zuordnen:
    # dns:
    #   - 192.168.1.1
    # extra_hosts:
    #   - "llm.example.lan:192.168.1.50"
    volumes:
      - llm-balancer-data:/data  # Server-Liste, Gruppen, Statistik und Zähler – überleben Updates/Neustarts
    # Läuft LiteLLM im selben Docker-Netz, das Netz hier eintragen, dann ist
    # der Balancer für LiteLLM unter http://llm-balancer:8080/v1 erreichbar:
    # networks: [litellm]

volumes:
  llm-balancer-data:

